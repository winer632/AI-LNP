# Central feature-flag registry for AI-LNP.
#
# This file is the single source of truth for which optional capabilities exist,
# what they default to, and which environment variable overrides them at run
# time. It is read by `src/config_flags.py`; nothing else should parse it.
#
# Resolution order for every flag (highest priority first):
#   1. an explicit `default=` argument passed to `is_enabled(...)`  (unknown flags only)
#   2. the flag's own environment variable (`env:` below, if declared)
#   3. the conventional environment variable `AI_LNP_FLAG_<NAME_IN_UPPER_CASE>`
#   4. `yaml_source:` below, when the flag mirrors another config file
#   5. `default:` below
#
# Accepted environment values (case-insensitive):
#   true  -> 1 true t yes y on enable enabled
#   false -> 0 false f no n off disable disabled
#   An empty or whitespace-only value is treated as "not set" so that
#   `AI_LNP_FLAG_X= command` falls back to the configured default instead of
#   silently meaning false.
#
# New capabilities default to `false` so they can be rolled out gradually.

flags_version: feature-flags-1.0.0
env_prefix: AI_LNP_FLAG_

flags:

  # --------------------------------------------------------------------- P0-a
  uniparse_ingestion:
    priority: P1
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement. GP-006 corpus goes 54 -> 260 blocks and
      the value 1.01 appears 4 times where page.get_text() found it 0
      times; that value is GO-006. Safe to default on because an
      unreachable service degrades to the pymupdf path with a recorded
      warning rather than failing ingestion.
    description: >-
      Route document ingestion through the external UniParse structural parsing
      service (see UNIPARSE_BASE_URL in .env.example) instead of the in-repo
      PDF/XML parser. Preserves sections, captions, tables, cells, and reading
      order so figure/table objects survive into the evidence graph.
    aliases: [P1, p1, uniparse]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/rag/ingestion.py

  # --------------------------------------------------------------------- P0-b
  full_evidence_view:
    priority: P0-a
    default: false
    status: available
    rationale: >-
      Available, not default. It contributes GO-015 and GO-007 to the
      union, but as a sole route it scores 7/15 against the compact
      route's 8/15, so it is an ensemble member rather than a
      replacement. Pin a full-view run by turning this on with
      compact_route off.
    description: >-
      Send the full local evidence inventory to the extraction call instead of
      the token-budgeted compact packet. Trades input cost for recall on papers
      whose evidence does not fit the compact budget.
    aliases: [P0-a, p0a, full_view]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/run_codex_one_call.py

  # --------------------------------------------------------------------- P1-a
  structured_evidence_view:
    priority: P1-a
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement. uniparse (P1) puts Table S2 into the corpus,
      but the compact packet's ranker then drops the row again: the GP-006
      compact packet contains 1.01 zero times while the committed structured
      packet at the same 16k budget contains it four times (206 evidence, 98
      structured, 15,995 tokens). With this on, the default run recovers
      GO-006 -- exact_numeric, and the record's own cited evidence supports
      it -- and single-run recall goes 10/15 -> 11/15. It costs precision,
      0.3125 -> 0.2586, because a run that emits more records matches a
      smaller fraction of them; precision_metrics carries that number.
      Two papers overshoot the budget on purpose (GP-004 29.7k, GP-008
      22.6k): structured evidence is never dropped, so a paper whose tables
      alone exceed the budget costs more tokens rather than losing a row.
    description: >-
      Build the extraction packet with src/rag/structured_compact_packet.py
      instead of the plain compact packet: keep every table, table_row,
      caption, figure_caption and figure block the local parse produced, then
      fill the remaining token budget by retrieval rank. Same budget, same
      CompactApiPacket type, same checksum rule. Read by
      run_codex_one_call.default_evidence_view, where full_evidence_view still
      takes precedence when the compact route is off. The paid
      run_compact_one_call path is deliberately not wired to it yet: this view
      has only been measured through the codex-exec harness.
    aliases: [P1-a, p1a, structured_view, structure_aware_packet]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/run_codex_one_call.py

  # ----------------------------------------------------------------------- P1
  precision_metrics:
    priority: P0-b
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement. Recall alone cannot separate a run that
      found more from one that emitted more: the 11/15 union carries
      precision 0.373 and 32 false additions. Reporting-only, so it
      cannot change an extraction.
    description: >-
      Compute dynamic precision/recall metrics during final gold evaluation
      rather than reporting only one-to-one recovery counts.
    aliases: [P0-b, p0b]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/evaluate_final_gold_dynamic.py

  vision_relationship_polarity:
    # No design-document priority id: this is a follow-on to P0-b/P2 rather
    # than a numbered roadmap item, and the id doubles as a lookup alias.
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement, and on safety. No result record in any
      shipped root carries vision_relationship, so turning this on moves
      no existing number: default stays 10/15 and codex_union_v1 stays
      11/15. On a union+vision root it takes recall 11/15 -> 12/15 and
      precision 0.3585 -> 0.3774, admitting GO-003 while GO-002 stays
      refused. The safety half is why it is not off: without it a
      not_colocalized read satisfies a gold row asserting colocalized,
      because tokenising the denial leaves "colocalized" in place. Off
      means that hole is open whenever vision records are merged.
    description: >-
      Judge a record that declares a vision relationship on that structured
      declaration rather than on its prose. Reads the vision contract's closed
      VisualRelationship vocabulary from the record's vision_relationship
      field: a denial of the relation a gold row asserts fails the polarity
      gate outright, and an affirmation discharges that one term while any
      other distinctive term still has to be met. Records that declare nothing
      -- every record from the text route -- are unaffected. Deliberately not a
      loosening of the token lexicon: equivalence classes over that lexicon
      were built and rejected for accepting 30% of 500 generated
      opposite-polarity candidates.
    aliases: [vision_polarity, relationship_polarity]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/evaluate_final_gold_dynamic.py

  # ----------------------------------------------------------------------- P2
  local_vlm_vision:
    priority: P2
    default: false
    status: available
    rationale: >-
      Available, not default. Its reads are the only source for the four
      outcomes the text path never produces, and with the relationship
      enum carried structurally they now score: merging the GP-004 and
      GP-006 reads takes the union from 11/15 to 12/15 and raises
      precision 0.2157 -> 0.2264. Left off because the merge is not
      uniformly positive -- adding the GP-008 reads gains no outcome and
      costs evidence coverage, because one-to-one matching reassigns an
      evidence-bearing record to another gold row. Corrects the earlier
      rationale here, which said the reads do not score; what was
      measured then was that they did not score, without separating
      whether the fault lay in the reads or in a downstream gate. It lay
      downstream.
    description: >-
      Use a local vision-language model (Ollama + Gemma) for targeted figure and
      table observation instead of a paid multimodal call. Output must stay
      structured observations with explicit abstention, never conclusions.
    aliases: [P2, p2]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/build_selective_vision_tasks.py
      - src/extraction/identify_selective_vision_referrals.py
      - src/extraction/selective_vision_contracts.py

  # ----------------------------------------------------------------------- P3
  expanded_discovery:
    priority: roadmap
    default: false
    status: planned
    rationale: >-
      Not implemented. Listed so the roadmap item has an id; there is no
      code path behind it and nothing reads this flag.
    description: >-
      Expand literature discovery beyond PubMed and Europe PMC (OpenAlex,
      semantic similarity, backward/forward citation chaining) while keeping
      deduplication and the complete search manifest.
    aliases: [discovery_expansion]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      []

  # ------------------------------------------------------------------ baseline
  # ---------------------------------------------------------------------- P3
  candidate_slot_enforcement:
    priority: P3
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement. Recovers GO-004, and the
      unsupported_extracted_disposition check rejects 76 of 83
      unsupported claims including 4 of 4 covering 1.01. It degrades
      with slot count -- 39 slots come back fully dispositioned, 168 do
      not -- so large papers should chunk via max_slots_per_call.
    description: >-
      Send the locally enumerated outcome-candidate slots with the first
      extraction call and require the model to account for every candidate id.
      Today the candidates are computed before the call but never sent, so a
      response that silently omits an experiment still passes schema validation.
    aliases: [P3, p3, candidate_must_answer]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/run_codex_one_call.py
      - src/extraction/run_compact_one_call.py

  compact_route:
    priority: baseline
    status: enabled
    rationale: >-
      Enabled on measurement, reversing the earlier plan to retire it.
      Compact plus slots scores 8/15 against the full view's 7/15, and
      37 of the 51 records in the 11/15 union come from compact-spec
      runs.
    # The compact route's activation gate used to be a dead config value that no
    # runtime code read. It is now a real switch: this flag mirrors the YAML key
    # below, and `is_enabled("compact_route")` is the only supported way to ask
    # whether the compact route may replace the baseline route.
    default: true
    yaml_source:
      path: config/extraction/compact_route_v1.yaml
      key: activation_gate.active
    description: >-
      Precedence rule for which evidence view a run selects, read by
      run_codex_one_call.default_evidence_view. Resolution is:
      structured_evidence_view wins if on; otherwise full_evidence_view
      wins only when this flag is off; otherwise compact. So this flag
      is a veto over the full view, not an activation gate. At the
      shipped defaults (structured on, full off) toggling it alone
      changes nothing observable, because the view it vetoes is already
      disabled -- that is inherent to a precedence rule and is stated
      here rather than papered over. It previously claimed to gate
      replacing the v4 baseline, which no code does with it.
    aliases: [compact_activation_gate, activation_gate]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/run_codex_one_call.py
