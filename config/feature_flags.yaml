# Central feature-flag registry for AI-LNP.
#
# This file is the single source of truth for which optional capabilities exist,
# what they default to, and which environment variable overrides them at run
# time. It is read by `src/config_flags.py`; nothing else should parse it.
#
# Resolution order for every flag (highest priority first):
#   1. an explicit `default=` argument passed to `is_enabled(...)`  (unknown flags only)
#   2. the flag's own environment variable (`env:` below, if declared)
#   3. the conventional environment variable `AI_LNP_FLAG_<NAME_IN_UPPER_CASE>`
#   4. `yaml_source:` below, when the flag mirrors another config file
#   5. `default:` below
#
# Accepted environment values (case-insensitive):
#   true  -> 1 true t yes y on enable enabled
#   false -> 0 false f no n off disable disabled
#   An empty or whitespace-only value is treated as "not set" so that
#   `AI_LNP_FLAG_X= command` falls back to the configured default instead of
#   silently meaning false.
#
# New capabilities default to `false` so they can be rolled out gradually.

flags_version: feature-flags-1.0.0
env_prefix: AI_LNP_FLAG_

flags:

  # --------------------------------------------------------------------- P1
  uniparse_ingestion:
    priority: P1
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement. GP-006's corpus goes 54 blocks to 259, and
      1.01 -- the value of GO-006 -- appears 6 times where the PyMuPDF
      path produced it 0 times; Table S2 is a rendered image, so
      page.get_text() returns nothing for it. Safe to default on because
      an unreachable service degrades to the pymupdf path with a
      recorded warning rather than failing ingestion.
    description: >-
      Route document ingestion through the external UniParse structural parsing
      service (see UNIPARSE_BASE_URL in .env.example) instead of the in-repo
      PDF/XML parser. Preserves sections, captions, tables, cells, and reading
      order so figure/table objects survive into the evidence graph.
    # Declared so the registry owns the precedence. It used to be read by hand
    # inside ingestion.uniparse_enabled() before is_enabled() was consulted,
    # which made it invisible to describe_flag and to anyone auditing what
    # governs this flag. Declaring it keeps deployments working -- a declared
    # env var outranks the conventional AI_LNP_FLAG_ one by the documented
    # resolution order -- while making it appear in env_vars.
    env: UNIPARSE_ENABLED
    aliases: [P1, p1, uniparse]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/rag/ingestion.py

  uniparse_crop_verification:
    # Section 十 of the design document, which calls this layer mandatory. It is
    # not a numbered roadmap priority, so it registers no priority id.
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement, and enabled because the alternative is
      citing a VLM transcription with nothing behind it. Section 十 says
      an unaudited uniparse parse "只是把幻觉从抽取阶段挪到解析阶段" --
      it merely moves hallucination from extraction to parsing, where it
      is harder to see because it looks like structured data. Measured on
      the block that carries GO-006's value: GP-006-B-098d79d1de1fdd6819a5,
      "Table S2 | LSEC | ... total insertion frequency: 1.01 ± 0.38 %",
      mmc1.pdf page 2. That region has no text layer at all --
      page.get_text() returns "" inside the recorded bbox -- so the parse
      was the only account of it. All 12 of the row's numbers are
      corroborated by macOS Vision OCR of a 600 dpi crop, and a second
      uniparse read of the region cut out on its own returns table HTML
      byte-identical to the first. The transcription is correct. But the
      same sweep over all 248 uniparse table/caption blocks in the corpus
      found five that are not: 42 of the 45 distinct sequence-length runs
      uniparse produced for GP-004's Supplementary Tables 2 and 3
      (41467_2021_20903_MOESM1_ESM.pdf pages 10-11) do not occur in those
      pages' own text layer. It gave the eGFP and HGF rows the Luciferase
      row's sequence, and corrupted the bases besides. Those pages are
      ordinary vector text, so a deterministic reader gets them right and
      the VLM did not. That is what section 十 warned about and what this
      flag exists to surface. Safe to default on because it
      costs no network call (the second read is opt-in), never drops a
      block, and degrades to "unverified" plus a warning when no reader is
      available -- which is the honest verdict, not a failure.
    description: >-
      Cross-check every uniparse table and caption block against a fresh crop of
      the page region it records. Renders the bbox with PyMuPDF, then re-reads it
      with readers that did not produce the parse -- the PDF text layer, local
      OCR of the crop, and optionally a second uniparse parse of the region cut
      out on its own -- and requires every number the parse asserts to appear in
      at least one of them. Sequence-length runs (24-plus alphanumeric
      characters: nucleotides, accessions) additionally have to occur in the
      region's own text layer, which is the check that caught GP-004. The
      verdict is stamped on the block as
      verification_status. Corroboration and contradiction are asymmetric on
      purpose: a token found in a noisy read counts, a token missing from one
      does not condemn the parse unless the reader was confident. On the GP-006
      crop macOS Vision misread two Hepatocyte cells (0.92 for 0.91, 0.02 for
      0.01) at confidence 0.5 and 0.3 while uniparse had them right, so a naive
      OCR-equality rule would have raised two false alarms on a correct table.
    aliases: [crop_verification, table_crop_crosscheck]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/rag/ingestion.py

  # --------------------------------------------------------------------- P0-a
  full_evidence_view:
    priority: P0-a
    default: false
    status: available
    rationale: >-
      Available, not default. It contributes GO-015 and GO-007 to the
      union, but as a sole route it scores 7/15 against the compact
      route's 8/15, so it is an ensemble member rather than a
      replacement. Pin a full-view run by turning this on with
      compact_route off.
    description: >-
      Send the full local evidence inventory to the extraction call instead of
      the token-budgeted compact packet. Trades input cost for recall on papers
      whose evidence does not fit the compact budget.
    aliases: [P0-a, p0a, full_view]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/run_codex_one_call.py

  # --------------------------------------------------------------------- P1-a
  structured_evidence_view:
    priority: P1-a
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement. The structured packet keeps table rows the
      budget would otherwise evict: GP-006's compact packet contains
      1.01 zero times and its structured packet contains it four times,
      which takes the default run from 10/15 to 11/15. The cost is
      precision 0.3125 to 0.1897 -- one-to-one matching means an added
      stage can only raise recall and lower precision -- and three
      papers exceed the 16k budget (GP-004 29,676, GP-008 22,624, GP-001
      18,551) because structured evidence is never dropped, so token
      cost is not bounded by budget_tokens.
    description: >-
      Build the extraction packet with src/rag/structured_compact_packet.py
      instead of the plain compact packet: keep every table, table_row,
      caption, figure_caption and figure block the local parse produced, then
      fill the remaining token budget by retrieval rank. Same budget, same
      CompactApiPacket type, same checksum rule. Read by
      run_codex_one_call.default_evidence_view, where full_evidence_view still
      takes precedence when the compact route is off. The paid
      run_compact_one_call path is deliberately not wired to it yet: this view
      has only been measured through the codex-exec harness.
    aliases: [P1-a, p1a, structured_view, structure_aware_packet]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/run_codex_one_call.py

  # ----------------------------------------------------------------------- P0-b
  precision_metrics:
    priority: P0-b
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement. Recall alone cannot separate a run that
      found more from one that emitted more: codex_union_v1 scores 11/15
      across 51 records at precision 0.2157 with 40 false additions.
      Reporting-only, so it cannot change an extraction. (The 0.373 and
      32 quoted here previously were the pre-fix figures produced when
      matches were counted by id-set membership.)
    description: >-
      Compute dynamic precision/recall metrics during final gold evaluation
      rather than reporting only one-to-one recovery counts.
    aliases: [P0-b, p0b]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/evaluate_final_gold_dynamic.py

  vision_relationship_polarity:
    # No design-document priority id: this is a follow-on to P0-b/P2 rather
    # than a numbered roadmap item, and the id doubles as a lookup alias.
    default: true
    status: enabled
    rationale: >-
      Enabled. A SelectiveVisionResponse carries a closed 7-value
      relationship enum emitted by a model that never saw the gold set;
      carrying it structurally lets a record satisfy the polarity gate
      on a declaration rather than on prose. This IS a loosening of that
      gate, and the only pair it flips across five result roots is
      GO-003 against its vision record. On the union plus the GP-004 and
      GP-006 reads: 11/15 at 0.2157 becomes 12/15 at 0.2264. It moves
      nothing on any root the repository ships as default, because those
      carry no vision records. A denied relation is vetoed, so
      not_colocalized cannot satisfy a gold row saying colocalized --
      which matters because that string tokenises to {not, colocalized}.
    description: >-
      Judge a record that declares a vision relationship on that structured
      declaration rather than on its prose. Reads the vision contract's closed
      VisualRelationship vocabulary from the record's vision_relationship
      field: a denial of the relation a gold row asserts fails the polarity
      gate outright, and an affirmation discharges that one term while any
      other distinctive term still has to be met. Records that declare nothing
      -- every record from the text route -- are unaffected. Deliberately not a
      loosening of the token lexicon: equivalence classes over that lexicon
      were built and rejected for accepting 30% of 500 generated
      opposite-polarity candidates.
    aliases: [vision_polarity, relationship_polarity]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/evaluate_final_gold_dynamic.py

  # ----------------------------------------------------------------------- P2
  local_vlm_vision:
    priority: P2
    default: false
    status: available
    rationale: >-
      Available, not default. Its reads are the only source for the four
      outcomes the text path never produces, and with the relationship
      enum carried structurally they score: merging the GP-004 and
      GP-006 reads takes codex_union_v1 from 11/15 at precision 0.2157
      to 12/15 at 0.2264. Left off because the merge is not uniformly
      positive -- adding the GP-008 reads gains no outcome and drops
      evidence coverage from 10 checked to 9, because one-to-one
      matching reassigns an evidence-bearing record to another gold row.
    description: >-
      Attach panel crops and the stricter abstain contract to a vision
      read. The route calls SELECTIVE_VISION_MODEL, which today is
      gpt-5.6-terra through the codex harness; an earlier version of
      this text said Ollama plus Gemma, and no such code exists in this
      repository.
    aliases: [P2, p2]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/build_selective_vision_tasks.py
      - src/extraction/identify_selective_vision_referrals.py
      - src/extraction/selective_vision_contracts.py

  # ----------------------------------------------------------------------- roadmap
  expanded_discovery:
    priority: roadmap
    default: false
    status: planned
    rationale: >-
      Not implemented. Listed so the roadmap item has an id; there is no
      code path behind it and nothing reads this flag.
    description: >-
      Expand literature discovery beyond PubMed and Europe PMC (OpenAlex,
      semantic similarity, backward/forward citation chaining) while keeping
      deduplication and the complete search manifest.
    aliases: [discovery_expansion]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      []

  # ------------------------------------------------------------------ baseline
  # ---------------------------------------------------------------------- P3
  candidate_slot_enforcement:
    priority: P3
    default: true
    status: enabled
    rationale: >-
      Enabled on measurement: it is the only ablation condition that
      recovers GO-004, and slot compliance degrades with count -- 39
      slots come back fully dispositioned, 168 do not -- so large papers
      should chunk via max_slots_per_call. A previous version of this
      rationale claimed the validator rejects 76 of 83 unsupported
      claims. That was a misreading of a note recording the opposite
      fact -- that 76 of 83 extracted claims cited no returned evidence
      -- and no committed validation report contains a single
      unsupported_extracted_disposition finding. Note also that GO-004
      is itself listed as a doubtful annotation in the design document.
    description: >-
      Send the locally enumerated outcome-candidate slots with the first
      extraction call and require the model to account for every candidate id.
      Today the candidates are computed before the call but never sent, so a
      response that silently omits an experiment still passes schema validation.
    aliases: [P3, p3, candidate_must_answer]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/run_codex_one_call.py
      - src/extraction/run_compact_one_call.py

  compact_route:
    priority: baseline
    status: enabled
    rationale: >-
      Enabled. Compact plus slots scores 8/15 against the full view's
      7/15, and 37 of the 51 records in codex_union_v1 come from
      compact-spec runs.
    # The compact route's activation gate used to be a dead config value that no
    # runtime code read. It is now a real switch: this flag mirrors the YAML key
    # below, and `is_enabled("compact_route")` is the only supported way to ask
    # whether the compact route may replace the baseline route.
    default: true
    yaml_source:
      path: config/extraction/compact_route_v1.yaml
      key: activation_gate.active
    description: >-
      Precedence rule for which evidence view a run selects, read by
      run_codex_one_call.default_evidence_view. Resolution is:
      structured_evidence_view wins if on; otherwise full_evidence_view
      wins only when this flag is off; otherwise compact. So this flag
      is a veto over the full view, not an activation gate. At the
      shipped defaults (structured on, full off) toggling it alone
      changes nothing observable, because the view it vetoes is already
      disabled -- that is inherent to a precedence rule and is stated
      here rather than papered over. It previously claimed to gate
      replacing the v4 baseline, which no code does with it.
    aliases: [compact_activation_gate, activation_gate]
    # Files that actually call is_enabled() for this flag. Verified by
    # test_declared_integration_points_really_read_the_flag, because this
    # list was wrong in 10 of 16 entries when it was merely aspirational.
    integration_points:
      - src/extraction/run_codex_one_call.py
